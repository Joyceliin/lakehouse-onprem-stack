# PostgreSQL Client Authentication — SOMENTE stack local de desenvolvimento
# (docker-compose.yml, porta publicada em 127.0.0.1).
# Nas VMs vale config/postgres/hive_pg_hba.conf: scram-sha-256 e IP exato.
#
# Socket local em trust: permite redefinir senha de dentro do container.
local   all             all                                     trust
host    all             all             127.0.0.1/32            md5
host    all             all             ::1/128                 md5
# Só redes privadas (faixas das redes Docker) — nunca 0.0.0.0/0.
host    all             all             10.0.0.0/8              md5
host    all             all             172.16.0.0/12           md5
host    all             all             192.168.0.0/16          md5
