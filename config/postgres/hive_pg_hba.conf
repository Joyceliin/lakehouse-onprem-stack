# PostgreSQL client authentication policy for the isolated Hive Metastore DB.
# Keep this file restrictive: only the Hive Metastore container may connect.
# Complementar com firewall do host: Thrift Hive só a partir da VM1.

local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Hive Metastore on the internal lakehouse Docker network.
host    all             all             10.10.10.30/32          scram-sha-256
