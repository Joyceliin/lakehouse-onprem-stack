connector.name=delta_lake
# URI completa injetada pelo compose (host + porta configuráveis via HIVE_METASTORE_URI).
hive.metastore.uri=${ENV:HIVE_METASTORE_URI}
hive.config.resources=/etc/hadoop/conf/core-site.xml

# MinIO — service account Trino (somente leitura) via HTTPS
# Valores injetados via variável de ambiente do container (sintaxe Trino ${ENV:VAR}).
# NUNCA hardcodar credenciais aqui.
hive.s3.endpoint=https://minio:9000
hive.s3.aws-access-key=${ENV:MINIO_TRINO_ACCESS_KEY}
hive.s3.aws-secret-key=${ENV:MINIO_TRINO_SECRET_KEY}
hive.s3.region=us-east-1
hive.s3.signer-type=S3SignerType
hive.s3.path-style-access=true
hive.s3.ssl.enabled=true
# Opcional — credencial por prefixo (modelo com placeholders, desligado por padrão):
# hive.s3.security-mapping.config-file=/etc/trino/s3-security-mapping.json

# Escrita concorrente desabilitada (um writer esperado).
delta.enable-non-concurrent-writes=true
# register_table habilitado — restringir ExecuteProcedure só ao grupo admin em rules.json
# (ver config/trino/ACL-VERIFICACAO.md). engenharia/analista não devem executar.
delta.register-table-procedure.enabled=true
