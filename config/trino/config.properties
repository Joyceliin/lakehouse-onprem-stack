coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/certs/trino-keystore.p12
http-server.https.keystore.key=${ENV:TRINO_KEYSTORE_PASSWORD}
discovery.uri=http://trino:8080

# Memória — Trino 435 (nó único: coordinator + worker).
# Restrição: max-memory-per-node + heap-headroom < -Xmx (ver jvm.config).
# Com 1 nó, o teto efetivo por query é o per-node; max-memory maior só ajuda
# se houver mais workers no futuro.
# query.max-total-memory-per-node NÃO existe nesta versão (removido ~369).
# Sessão (admin): SET SESSION query_max_memory_per_node = '12GB';
query.max-memory-per-node=12GB
query.max-memory=50GB
query.max-total-memory=60GB
memory.heap-headroom-per-node=2GB

# Autenticação obrigatória em homologação/produção
http-server.authentication.type=PASSWORD
password-authenticator.config-files=/etc/trino/password-authenticator.properties
# Grupos: arquivo group-provider.properties em /etc/trino/ (Trino 435 carrega
# automaticamente — NÃO usar group-provider.config-files no config.properties).
access-control.config-files=/etc/trino/access-control.properties
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
# Acesso externo apenas via HTTPS; HTTP fica para comunicação interna da rede Docker.
http-server.process-forwarded=true
