# Catálogo Delta da stack LOCAL de desenvolvimento (docker-compose.yml).
# MinIO em HTTP e credenciais vindas do ambiente do container.
# Nas VMs vale config/trino/catalog/delta.properties (HTTPS + conta só leitura).
connector.name=delta_lake
hive.metastore.uri=${ENV:HIVE_METASTORE_URI}

hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
hive.s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
hive.s3.region=us-east-1
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false

delta.enable-non-concurrent-writes=true
delta.register-table-procedure.enabled=true
