# docker-compose.lakehouse-vm2.yml
# Serviços de storage e consulta na VM2: MinIO + Hive Metastore + Trino.
# O Hive Metastore usa um PostgreSQL técnico isolado nesta VM.
#
# Segurança / verificação:
#   config/minio/POLICIES-VERIFICACAO.md
#   config/trino/ACL-VERIFICACAO.md
#   env.lakehouse-vm2.example (firewall, audit, secrets, TLS MinIO)
# TLS MinIO: gerar certs antes do up —
#   LAKEHOUSE_PRIVATE_BIND_ADDRESS=<IP> bash scripts/minio/gen-tls-certs.sh
#
# Porta Thrift do Hive: HIVE_METASTORE_PORT (padrão 9083). Ex.: 7077 na VM2
# se a 9083 estiver ocupada no host.
#
# Subir com:
#   docker compose -f docker-compose.lakehouse-vm2.yml up -d minio minio-http-proxy minio-init
#   ./scripts/minio/set-user.sh trino --write-secrets
#   ./scripts/minio/set-user.sh hive  --write-secrets
#   ./scripts/minio/set-user.sh <user> --read bucket[/prefix]   # policy dinamica
# minio-init: infra + policies internas (trino/hive JSON). Contas: set-user.sh
# Exige config/minio/certs/{private.key,public.crt}
# e .env_secrets/minio_truststore.jks + minio_truststore_password (gen-tls-certs.sh).
# Truststore: chmod 600 e chown 1000:1000 (UID trino) — nunca 644 world-readable.
# Portas host: 9001=nginx HTTP (HAProxy/domínio), 9000=MinIO API HTTPS (Airflow).
# Console MinIO (:9001 no container) só na rede Docker — acesso web via nginx.

networks:
  lakehouse:
    driver: bridge
    ipam:
      config:
        - subnet: ${LAKEHOUSE_DOCKER_SUBNET:-10.10.10.0/24}

services:

  # ─────────────────────────────────────────
  # MINIO (object storage S3-compatible)
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      # Derivados de MINIO_TLS_DNS (override opcional no .env)
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-https://${MINIO_TLS_DNS}}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-https://${MINIO_TLS_DNS}/browser}
      MINIO_AUDIT_WEBHOOK_ENABLE: ${MINIO_AUDIT_WEBHOOK_ENABLE:-off}
      MINIO_AUDIT_WEBHOOK_ENDPOINT: ${MINIO_AUDIT_WEBHOOK_ENDPOINT:-}
    volumes:
      - ${MINIO_DATA_DIR:-/dados/minio}:/data   # disco de dados dedicado do host
      - ./config/minio/policies:/etc/minio/policies:ro
      # TLS: public.crt + private.key (gerar com scripts/minio/gen-tls-certs.sh)
      - ${LAKEHOUSE_MINIO_CERTS_DIR:-./config/minio/certs}:/root/.minio/certs:ro
    secrets:
      - minio_root_user
      - minio_root_password
    ports:
      # API HTTPS — Airflow/clientes S3
      - "${LAKEHOUSE_PRIVATE_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      # Console NÃO publicada no host — HAProxy usa nginx na :9001
    networks:
      lakehouse:
        ipv4_address: ${MINIO_CONTAINER_IP:-10.10.10.10}
    healthcheck:
      # -k: aceita cert self-signed no healthcheck local
      test: ["CMD-SHELL", "curl -sfk https://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # HTTP :9001 — HAProxy. Host allowlist = MINIO_TLS_DNS (ou MINIO_PUBLIC_HOST)
  minio-http-proxy:
    image: nginx:1.27-alpine
    container_name: minio-http-proxy
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_PUBLIC_HOST: ${MINIO_PUBLIC_HOST:-${MINIO_TLS_DNS:?defina MINIO_TLS_DNS=FQDN do storage}}
    volumes:
      - ./config/minio/nginx-http-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${LAKEHOUSE_PRIVATE_BIND_ADDRESS:-127.0.0.1}:9001:80"
    networks:
      - lakehouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --header=\"Host: $${MINIO_PUBLIC_HOST}\" http://127.0.0.1/minio/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-https://minio:9000}
    volumes:
      - ./scripts/minio/init.sh:/init.sh:ro
      - ./config/minio/policies:/policies:ro
      - ${LAKEHOUSE_MINIO_CERTS_DIR:-./config/minio/certs}/public.crt:/certs/public.crt:ro
    secrets:
      - minio_root_user
      - minio_root_password
    networks:
      - lakehouse
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  # ─────────────────────────────────────────
  # POSTGRESQL DO HIVE (metadados técnicos isolados)
  # ─────────────────────────────────────────
  hive-postgres:
    image: postgres:17
    container_name: hive-postgres
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_DB: ${HIVE_METASTORE_DB_NAME:-hive_metastore}
      POSTGRES_USER: ${HIVE_METASTORE_DB_USER:-hive_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/hive_postgres_password
    volumes:
      - hive-postgres-data:/var/lib/postgresql/data
      - ./config/postgres/hive_pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    secrets:
      - hive_postgres_password
    expose:
      - "5432"
    networks:
      lakehouse:
        ipv4_address: ${HIVE_POSTGRES_CONTAINER_IP:-10.10.10.20}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────
  # HIVE METASTORE (backend = PostgreSQL isolado da VM2)
  # ─────────────────────────────────────────
  hive-metastore:
    build:
      context: ./config/hive
      dockerfile: Dockerfile
    image: delta-stack/hive-metastore:3.1.3
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      METASTORE_PORT: ${HIVE_METASTORE_PORT:-9083}
      DB_DRIVER: postgres
      # Credenciais MinIO (service account hive-meta) via Docker secrets.
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/minio_hive_access_key
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/minio_hive_secret_key
      # Backend Postgres isolado na VM2 — senha via Docker secret.
      HIVE_METASTORE_DB_USER: ${HIVE_METASTORE_DB_USER:-hive_user}
      HIVE_METASTORE_DB_PASSWORD_FILE: /run/secrets/hive_postgres_password
      HIVE_METASTORE_DB_HOST: hive-postgres
      HIVE_METASTORE_DB_NAME: ${HIVE_METASTORE_DB_NAME:-hive_metastore}
      MINIO_TRUSTSTORE_PASSWORD_FILE: /run/secrets/minio_truststore_password
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-postgres:5432/${HIVE_METASTORE_DB_NAME:-hive_metastore}
        -Djavax.jdo.option.ConnectionUserName=${HIVE_METASTORE_DB_USER:-hive_user}
    # Thrift só na rede Docker (Trino). Sem ports: no host — metastore sem auth de app.
    expose:
      - "${HIVE_METASTORE_PORT:-9083}"
    volumes:
      - ./config/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./config/hive/entrypoint.sh:/entrypoint.sh:ro
      - ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/minio_truststore.jks:/opt/hive/conf/minio-truststore.jks:ro
    secrets:
      - minio_hive_access_key
      - minio_hive_secret_key
      - hive_postgres_password
      - minio_truststore_password
    networks:
      lakehouse:
        ipv4_address: ${HIVE_METASTORE_CONTAINER_IP:-10.10.10.30}
    depends_on:
      hive-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─────────────────────────────────────────
  # TRINO (engine analítica)
  # ─────────────────────────────────────────
  trino:
    image: trinodb/trino:435
    container_name: trino
    environment:
      HIVE_METASTORE_PORT: ${HIVE_METASTORE_PORT:-9083}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        export MINIO_TRINO_ACCESS_KEY="$$(tr -d '\r\n' < /etc/trino-secrets/minio_trino_access_key)"
        export MINIO_TRINO_SECRET_KEY="$$(tr -d '\r\n' < /etc/trino-secrets/minio_trino_secret_key)"
        export TRINO_INTERNAL_SHARED_SECRET="$$(tr -d '\r\n' < /etc/trino-secrets/trino_internal_shared_secret)"
        export TRINO_KEYSTORE_PASSWORD="$$(tr -d '\r\n' < /etc/trino-secrets/trino_keystore_password)"
        TS_PASS="$$(tr -d '\r\n' < /etc/trino-secrets/minio_truststore_password)"
        export AWS_ACCESS_KEY_ID="$$MINIO_TRINO_ACCESS_KEY"
        export AWS_SECRET_ACCESS_KEY="$$MINIO_TRINO_SECRET_KEY"
        export HIVE_METASTORE_URI="thrift://hive-metastore:$${HIVE_METASTORE_PORT:-9083}"
        export JAVA_TOOL_OPTIONS="$${JAVA_TOOL_OPTIONS:-} -Djavax.net.ssl.trustStore=/etc/trino-certs/minio-truststore.jks -Djavax.net.ssl.trustStorePassword=$${TS_PASS}"
        unset TS_PASS
        exec /usr/lib/trino/bin/run-trino
    volumes:
      - ./config/trino:/etc/trino:ro
      - ./config/trino/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
      - ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/minio_truststore.jks:/etc/trino-certs/minio-truststore.jks:ro
      # Fora de /etc/trino (montado :ro) — senão o Docker não cria os mountpoints.
      - ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/minio_trino_access_key:/etc/trino-secrets/minio_trino_access_key:ro
      - ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/minio_trino_secret_key:/etc/trino-secrets/minio_trino_secret_key:ro
      - ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/trino_internal_shared_secret:/etc/trino-secrets/trino_internal_shared_secret:ro
      - ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/trino_keystore_password:/etc/trino-secrets/trino_keystore_password:ro
      - ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/minio_truststore_password:/etc/trino-secrets/minio_truststore_password:ro
      # password.db / groups.txt fora do volume :ro (chmod 644 no host — não 600).
      - ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/trino_password.db:/etc/trino-secrets/trino_password.db:ro
      - ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/trino_groups.txt:/etc/trino-secrets/trino_groups.txt:ro
    ports:
      # HTTPS na 8080 do host → 8443 do container (TLS/keystore). HTTP 8080 do container não é publicado.
      - "${LAKEHOUSE_PRIVATE_BIND_ADDRESS:-127.0.0.1}:${TRINO_HOST_PORT:-8080}:8443"
    networks:
      lakehouse:
        ipv4_address: ${TRINO_CONTAINER_IP:-10.10.10.40}
    depends_on:
      hive-metastore:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  hive-postgres-data:

secrets:
  minio_root_user:
    file: ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/minio_root_user
  minio_root_password:
    file: ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/minio_root_password
  minio_hive_access_key:
    file: ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/minio_hive_access_key
  minio_hive_secret_key:
    file: ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/minio_hive_secret_key
  minio_trino_access_key:
    file: ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/minio_trino_access_key
  minio_trino_secret_key:
    file: ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/minio_trino_secret_key
  trino_internal_shared_secret:
    file: ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/trino_internal_shared_secret
  trino_keystore_password:
    file: ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/trino_keystore_password
  hive_postgres_password:
    file: ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/hive_postgres_password
  minio_truststore_password:
    file: ${LAKEHOUSE_SECRETS_DIR:-./.env_secrets}/minio_truststore_password
